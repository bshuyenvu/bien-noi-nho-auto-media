name: Apply Phase 8.2 Runtime Patch

on:
  push:
    branches: ["phase8-2-energy-manifest"]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8-2-energy-manifest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact runtime patch
        run: python3 scripts/apply-phase8-2.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        run: npm run typecheck && npm run build
      - name: ShotCraft planner and manifest smoke
        run: npm run smoke:shotcraft-lite && npm run smoke:shotcraft-manifest
      - name: Commit runtime changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/video/ffmpeg.ts src/video/job.ts
          git diff --cached --check
          git commit -m 'Phase 8.2: energy-aware camera and render manifest integration'
          git push origin HEAD:phase8-2-energy-manifest

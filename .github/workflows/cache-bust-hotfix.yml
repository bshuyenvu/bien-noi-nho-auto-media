name: Cache Bust Hotfix

on:
  push:
    branches: ["phase7-cache-bust"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase7-cache-bust
      - name: Replace asset version token with release revision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/server.ts')
          s=p.read_text(encoding='utf-8')
          old='const v=APP_VERSION;'
          new="const v=encodeURIComponent(APP_REVISION.slice(0,12));"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one asset token, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run smoke:ui
      - name: Commit hotfix to branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/server.ts
          git commit -m "Hotfix: revision-based asset cache busting"
          git push origin HEAD:phase7-cache-bust

name: Phase 11 V3.1 one-time sync
on:
  push:
    paths:
      - '.github/workflows/phase11-v31-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified source patch
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://media.huyenvu.cloud/output/phase11-v31-966e236.patch' -o /tmp/phase11.patch
          echo '6855b63ae5152490905bd2971669bb55020081c81676bf8770c731741529d461  /tmp/phase11.patch' | sha256sum -c -
      - name: Apply Phase 11 source
        run: |
          git apply --check /tmp/phase11.patch
          git apply /tmp/phase11.patch
      - name: Validate
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run smoke:multi-content
          npm run smoke:voice-studio
          npm run smoke:ui
          npm run smoke:copyright-safe
      - name: Commit synchronized source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Phase 11: Multi-Content Studio V3.1 with rights-safe media and Voice Studio'
          git push origin HEAD:main

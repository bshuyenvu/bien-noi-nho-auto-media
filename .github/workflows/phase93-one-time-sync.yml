name: One-time Phase 9.3 source sync

on:
  push:
    paths:
      - '.github/workflows/phase93-one-time-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified source patch
        run: |
          curl --fail --location --silent --show-error \
            https://media.huyenvu.cloud/output/phase93-sync.patch \
            --output /tmp/phase93-sync.patch
          echo '2dc5248a49dcbb3738a3fcdb9ff218c83718bb54b9edde4e61823533c02350c1  /tmp/phase93-sync.patch' | sha256sum --check

      - name: Apply Phase 9.2-9.3 tree
        run: git apply --index /tmp/phase93-sync.patch

      - name: Validate
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run smoke:ui
          npm run smoke:health-studio

      - name: Commit synchronized source
        run: |
          git config user.name 'VietNewsFlow Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Phase 9.2-9.3: health topic research and local Vietnamese translation fallback'
          git push origin HEAD:main

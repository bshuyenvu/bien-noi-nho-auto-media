name: Sync Copyright Safe Health

on:
  push:
    branches: ["copyright-safe-health"]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: copyright-safe-health
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download verified patch
        run: |
          curl -fsSL https://media.huyenvu.cloud/output/copyright-safe-health-sync.patch.b64 -o /tmp/code.patch.b64
          echo "40d6d5a77f838542267774fe308b5ec13b71d7528e877dd3dc49b7b716f84f9d  /tmp/code.patch.b64" | sha256sum -c -
          base64 -d /tmp/code.patch.b64 > /tmp/code.patch
      - name: Apply product patch
        run: git apply --index /tmp/code.patch
      - name: Verify Copyright Safe contracts
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run smoke:source-coherence
          npm run smoke:copyright-safe
          npm run smoke:editorial-professional
          npm run smoke:shotcraft-lite
          npm run smoke:ui
          npm run build
      - name: Commit synchronized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Safety: sync copyright-safe health implementation"
          git push origin HEAD:copyright-safe-health

name: Sync Copyright Safe Health

on:
  push:
    branches: ["copyright-safe-health"]
    paths:
      - ".github/workflows/sync-copyright-safe.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: copyright-safe-health
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch and verify patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://media.huyenvu.cloud/output/sync-csafe-20260910.patch.b64' -o /tmp/sync.patch.b64
          echo 'c6f568b7e1bd25b1e893ee62fbc07ab4d32d4905af3df992b92de49d0ef3db2a  /tmp/sync.patch.b64' | sha256sum -c -
          base64 -d /tmp/sync.patch.b64 > /tmp/sync.patch
          git apply --check /tmp/sync.patch
          git apply /tmp/sync.patch
      - name: Verify changed source
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run smoke:source-coherence
          npm run smoke:copyright-safe
          npm run smoke:editorial-professional
          npm run smoke:shotcraft-lite
      - name: Commit synchronized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Safety: copyright-safe health mode with source coherence'
          git push origin HEAD:copyright-safe-health

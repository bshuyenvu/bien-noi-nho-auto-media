name: Sync Copyright UI

on:
  push:
    branches: ["copyright-safe-health"]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: copyright-safe-health
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download verified UI patch
        run: |
          curl -fsSL https://media.huyenvu.cloud/output/copyright-ui-rights.patch.b64 -o /tmp/ui.patch.b64
          echo "d7f851f30771328bbdee737a32800b37ce75c9c6cc959288f5edb6a0431fd576  /tmp/ui.patch.b64" | sha256sum -c -
          base64 -d /tmp/ui.patch.b64 > /tmp/ui.patch
      - name: Apply UI patch
        run: git apply --index /tmp/ui.patch
      - name: Verify UI contracts
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run smoke:ui
          npm run smoke:copyright-safe
      - name: Commit UI rights controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Safety: add media rights controls to Studio"
          git push origin HEAD:copyright-safe-health

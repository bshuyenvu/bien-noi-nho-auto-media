name: Typecheck

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: TypeScript build
        run: npm run build
      - name: Persistent render recovery smoke test
        run: npm run smoke:recovery
      - name: Publish queue and credential vault smoke test
        run: npm run smoke:publish

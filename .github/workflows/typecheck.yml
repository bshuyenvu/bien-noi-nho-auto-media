name: Typecheck

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: TypeScript build
        run: npm run build
      - name: Compiled production server startup smoke test
        run: npm run smoke:production
      - name: Docker Compose production config validation
        run: docker compose config -q
      - name: VieNeu v3turbo and Adam configuration smoke test
        run: npm run smoke:vieneu-config
      - name: Wyse deploy backup rollback smoke test
        run: npm run smoke:wyse-ops
      - name: V1 private-first deployment safety smoke test
        run: npm run smoke:v1-private-deploy
      - name: Production monitoring incident lifecycle smoke test
        run: npm run smoke:monitoring
      - name: Safe self-heal and external alert smoke test
        run: npm run smoke:self-heal-alerts
      - name: Maintenance ACK silence smoke test
        run: npm run smoke:maintenance
      - name: Operator audit trail smoke test
        run: npm run smoke:audit
      - name: Production analytics KPI and timing smoke test
        run: npm run smoke:analytics
      - name: AI operations assistant read-only smoke test
        run: npm run smoke:ops-assistant
      - name: Durable production queue and publish reconcile smoke test
        run: npm run smoke:durable-queue
      - name: Durable Review Gate and approval version smoke test
        run: npm run smoke:review-gate
      - name: Immutable render artifact integrity smoke test
        run: npm run smoke:artifact-integrity
      - name: End-to-end consistency and recovery smoke test
        run: npm run smoke:consistency
      - name: YouTube resumable upload retry and restart smoke test
        run: npm run smoke:youtube-resumable
      - name: Release candidate GO NO-GO and backup restore smoke test
        run: npm run smoke:release-candidate
      - name: Production activation wizard and promotion safety smoke test
        run: npm run smoke:activation-wizard
      - name: YouTube Remote Canary verification smoke test
        run: npm run smoke:youtube-canary
      - name: Controlled Public Rollout and post-publish watch smoke test
        run: npm run smoke:public-rollout
      - name: Gradual Public Ramp and circuit breaker smoke test
        run: npm run smoke:public-ramp
      - name: Content Safety and duplicate publish guard smoke test
        run: npm run smoke:content-safety
      - name: Production cutover and Unlisted canary smoke test
        run: npm run smoke:cutover
      - name: Production operator check syntax
        run: node --check scripts/production-check.mjs
      - name: Persistent render recovery smoke test
        run: npm run smoke:recovery
      - name: Publish queue and credential vault smoke test
        run: npm run smoke:publish
      - name: YouTube OAuth and resumable upload smoke test
        run: npm run smoke:youtube-oauth
      - name: Frontend dashboard syntax smoke test
        run: npm run smoke:ui
      - name: V1 Production final acceptance contract
        run: npm run smoke:v1-acceptance

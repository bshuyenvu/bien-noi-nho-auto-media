name: V3.3.2 one-time sync
on:
  push:
    paths:
      - '.github/workflows/v332-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified patch
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://media.huyenvu.cloud/output/v332-sync.patch' -o /tmp/v332.patch
          echo '3d09a187bd9bd629ebc464da2aa5f62b1caab199ba8018ac5e54544e1b7784f1  /tmp/v332.patch' | sha256sum -c -
      - name: Apply patch
        run: |
          git apply --check /tmp/v332.patch
          git apply /tmp/v332.patch
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: UI contract
        run: npm run smoke:ui
      - name: Render History
        run: npm run smoke:render-history
      - name: Review Gate
        run: npm run smoke:review-gate
      - name: Copyright
        run: npm run smoke:copyright-safe
      - name: Commit synchronized source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add render history playback and safe deletion'
          git push origin HEAD:main

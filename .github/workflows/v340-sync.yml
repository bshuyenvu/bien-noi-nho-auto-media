name: V3.4 one-time sync
on:
  push:
    paths:
      - '.github/workflows/v340-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified patch
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://media.huyenvu.cloud/output/v340-sync.patch' -o /tmp/v340.patch
          echo '1e2a527e673f14b130a561fd4b284e878e48cb29bfac3ba648879c24b2b48809  /tmp/v340.patch' | sha256sum -c -
      - name: Apply patch
        run: |
          git apply --check /tmp/v340.patch
          git apply /tmp/v340.patch
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: UI V3.4
        run: npm run smoke:ui
      - name: Render History
        run: npm run smoke:render-history
      - name: Voice Studio
        run: npm run smoke:voice-studio
      - name: Review Gate
        run: npm run smoke:review-gate
      - name: Copyright
        run: npm run smoke:copyright-safe
      - name: Commit synchronized source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'V3.4: unify workspace navigation and channel settings'
          git push origin HEAD:main

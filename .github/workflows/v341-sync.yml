name: V3.4.1 one-time sync
on:
  push:
    paths:
      - '.github/workflows/v341-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified patch
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://media.huyenvu.cloud/output/v341-sync.patch' -o /tmp/v341.patch
          echo '58d6635d3c231e979e4bbc81a1a7bd9bc945572c1d9fc54c02d7e599ab87ac92  /tmp/v341.patch' | sha256sum -c -
      - name: Apply patch
        run: |
          git apply --check /tmp/v341.patch
          git apply /tmp/v341.patch
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: UI V3.4.1
        run: npm run smoke:ui
      - name: Voice Studio
        run: npm run smoke:voice-studio
      - name: Render History
        run: npm run smoke:render-history
      - name: Review Gate
        run: npm run smoke:review-gate
      - name: Copyright
        run: npm run smoke:copyright-safe
      - name: Commit synchronized source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'V3.4.1: move workspace settings behind account and config'
          git push origin HEAD:main

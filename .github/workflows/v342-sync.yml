name: V3.4.2 one-time sync
on:
  push:
    paths:
      - '.github/workflows/v342-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified patch
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://media.huyenvu.cloud/output/v342-sync.patch' -o /tmp/v342.patch
          echo '0468d6b511606b53c0d907dcb29d5d967fbb54d4d1f6fa852c9c695bff400950  /tmp/v342.patch' | sha256sum -c -
      - name: Apply patch
        run: |
          git apply --check /tmp/v342.patch
          git apply /tmp/v342.patch
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: UI V3.4.2
        run: npm run smoke:ui
      - name: Health Studio
        run: npm run smoke:health-studio
      - name: Multi Content
        run: npm run smoke:multi-content
      - name: Voice Studio
        run: npm run smoke:voice-studio
      - name: Copyright Safe
        run: npm run smoke:copyright-safe
      - name: Source Coherence
        run: npm run smoke:source-coherence
      - name: Review Gate
        run: npm run smoke:review-gate
      - name: Commit synchronized source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'V3.4.2: topic coherence, karaoke scenes, fast render recovery'
          git push origin HEAD:main
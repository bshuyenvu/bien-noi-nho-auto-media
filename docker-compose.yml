services:
  auto-media:
    image: bien-noi-nho-auto-media:${APP_IMAGE_TAG:-current}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_REVISION: ${APP_REVISION:-unknown}
    container_name: bien-noi-nho-auto-media
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=768}
      DB_PATH: /app/data/auto-media.sqlite
      RENDER_OUTPUT_DIR: /app/output
      RENDER_API_KEY: ${RENDER_API_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      ADMIN_CLERK_USER_IDS: ${ADMIN_CLERK_USER_IDS:-}
      DEFAULT_CHANNEL_NAME: ${DEFAULT_CHANNEL_NAME:-Biển & Nỗi Nhớ}

      CREDENTIAL_VAULT_KEY: ${CREDENTIAL_VAULT_KEY:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-}
      PUBLISH_LIVE_ENABLED: ${PUBLISH_LIVE_ENABLED:-false}
      PUBLISH_WORKER_INTERVAL_MS: ${PUBLISH_WORKER_INTERVAL_MS:-15000}
      PUBLISH_STARTUP_DIAGNOSTICS: ${PUBLISH_STARTUP_DIAGNOSTICS:-true}
      PUBLISH_STRICT_STARTUP: ${PUBLISH_STRICT_STARTUP:-false}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:-}
      YOUTUBE_PRIVACY_STATUS: ${YOUTUBE_PRIVACY_STATUS:-private}
      YOUTUBE_CATEGORY_ID: ${YOUTUBE_CATEGORY_ID:-22}
      YOUTUBE_UPLOAD_CHUNK_BYTES: ${YOUTUBE_UPLOAD_CHUNK_BYTES:-8388608}
      YOUTUBE_CONTAINS_SYNTHETIC_MEDIA: ${YOUTUBE_CONTAINS_SYNTHETIC_MEDIA:-true}
      YOUTUBE_READINESS_MAX_AGE_MS: ${YOUTUBE_READINESS_MAX_AGE_MS:-900000}

      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_API_URL: ${OLLAMA_API_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
      GEMINI_API_URL: ${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      VISION_API_URL: ${VISION_API_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-}
      VIENEU_TTS_ENABLED: ${VIENEU_TTS_ENABLED:-false}
      VIENEU_TTS_URL: ${VIENEU_TTS_URL:-http://vieneu-tts:7861}
      VIENEU_TTS_TIMEOUT_MS: ${VIENEU_TTS_TIMEOUT_MS:-240000}

      LOW_MEMORY_MODE: ${LOW_MEMORY_MODE:-true}
      RENDER_QUEUE_PAUSED: ${RENDER_QUEUE_PAUSED:-false}
      RENDER_MIN_AVAILABLE_MB: ${RENDER_MIN_AVAILABLE_MB:-512}
      RENDER_MAX_LOAD_PER_CPU: ${RENDER_MAX_LOAD_PER_CPU:-0.85}
      RENDER_RESOURCE_POLL_MS: ${RENDER_RESOURCE_POLL_MS:-10000}
      RENDER_RESOURCE_MAX_WAIT_MS: ${RENDER_RESOURCE_MAX_WAIT_MS:-900000}
      RENDER_MIN_FREE_DISK_MB: ${RENDER_MIN_FREE_DISK_MB:-2048}
      RENDER_MAX_OUTPUT_MB: ${RENDER_MAX_OUTPUT_MB:-8192}
      RENDER_OUTPUT_RETENTION_HOURS: ${RENDER_OUTPUT_RETENTION_HOURS:-72}
      RENDER_WATCHDOG_MS: ${RENDER_WATCHDOG_MS:-1200000}
      RENDER_MAX_ATTEMPTS: ${RENDER_MAX_ATTEMPTS:-3}
      RENDER_RETRY_BASE_MS: ${RENDER_RETRY_BASE_MS:-15000}
      TTS_TIMEOUT_MS: ${TTS_TIMEOUT_MS:-300000}
      FFMPEG_TIMEOUT_MS: ${FFMPEG_TIMEOUT_MS:-1800000}
      SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-5000}
      MONITOR_INTERVAL_MS: ${MONITOR_INTERVAL_MS:-30000}
      MONITOR_WARN_AVAILABLE_MB: ${MONITOR_WARN_AVAILABLE_MB:-768}
      MONITOR_WARN_LOAD_PER_CPU: ${MONITOR_WARN_LOAD_PER_CPU:-0.70}
      MONITOR_HISTORY_DAYS: ${MONITOR_HISTORY_DAYS:-30}
      AUTOPILOT_ENABLED: ${AUTOPILOT_ENABLED:-true}
      AUTOPILOT_INTERVAL_MINUTES: ${AUTOPILOT_INTERVAL_MINUTES:-15}
      AUTOPILOT_LENGTH: ${AUTOPILOT_LENGTH:-60}
      AUTOPILOT_FORMAT: ${AUTOPILOT_FORMAT:-latest}
      AUTOPILOT_TEMPLATE: ${AUTOPILOT_TEMPLATE:-clean}
      AUTOPILOT_MOTION: ${AUTOPILOT_MOTION:-light}
      AUTOPILOT_MAX_PER_DAY: ${AUTOPILOT_MAX_PER_DAY:-24}
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    mem_limit: ${APP_MEM_LIMIT:-2800m}
    mem_reservation: 512m
    cpus: ${APP_CPUS:-2.0}
    pids_limit: 256
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  vieneu-tts:
    profiles: ["vieneu"]
    build:
      context: .
      dockerfile: services/vieneu-tts/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    environment:
      VIENEU_MODE: ${VIENEU_MODE:-v3nano}
      HF_HOME: /models
    volumes:
      - vieneu-models:/models
    mem_limit: 2200m
    cpus: 2.0

volumes:
  vieneu-models:

services:
  auto-media:
    build: .
    container_name: bien-noi-nho-auto-media
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      RENDER_API_KEY: ${RENDER_API_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      ADMIN_CLERK_USER_IDS: ${ADMIN_CLERK_USER_IDS:-}
      DEFAULT_CHANNEL_NAME: ${DEFAULT_CHANNEL_NAME:-Biển & Nỗi Nhớ}
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_API_URL: ${OLLAMA_API_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
      GEMINI_API_URL: ${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      VISION_API_URL: ${VISION_API_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-}
      VIENEU_TTS_ENABLED: ${VIENEU_TTS_ENABLED:-false}
      VIENEU_TTS_URL: ${VIENEU_TTS_URL:-http://vieneu-tts:7861}
      VIENEU_TTS_TIMEOUT_MS: ${VIENEU_TTS_TIMEOUT_MS:-240000}
      AUTOPILOT_ENABLED: ${AUTOPILOT_ENABLED:-true}
      AUTOPILOT_INTERVAL_MINUTES: ${AUTOPILOT_INTERVAL_MINUTES:-15}
      AUTOPILOT_LENGTH: ${AUTOPILOT_LENGTH:-60}
      AUTOPILOT_FORMAT: ${AUTOPILOT_FORMAT:-latest}
      AUTOPILOT_TEMPLATE: ${AUTOPILOT_TEMPLATE:-clean}
      AUTOPILOT_MOTION: ${AUTOPILOT_MOTION:-light}
      AUTOPILOT_MAX_PER_DAY: ${AUTOPILOT_MAX_PER_DAY:-24}
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
  vieneu-tts:
    profiles: ["vieneu"]
    build:
      context: .
      dockerfile: services/vieneu-tts/Dockerfile
    restart: unless-stopped
    environment:
      VIENEU_MODE: ${VIENEU_MODE:-v3nano}
      HF_HOME: /models
    volumes:
      - vieneu-models:/models
    mem_limit: 2200m
    cpus: 2.0

volumes:
  vieneu-models:

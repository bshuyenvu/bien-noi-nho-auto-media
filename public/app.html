<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biển & Nỗi Nhớ Auto Media</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#07111f;color:#eef2ff}.wrap{max-width:1180px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#111827,#172554);padding:26px;border-radius:22px}.badge{background:#b91c1c;padding:6px 11px;border-radius:999px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.card{background:#111827;border:1px solid #263449;border-radius:18px;padding:20px}label{display:block;margin:12px 0 5px}input,textarea,select{width:100%;padding:11px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:white}textarea{min-height:150px}button{margin-top:14px;background:#dc2626;color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.draft{border-top:1px solid #263449;padding:13px 0}.status{font-size:12px;padding:4px 8px;background:#1e293b;border-radius:999px}.ready{background:#166534}video{width:100%;max-height:560px;background:black;border-radius:14px}@media(max-width:800px){.layout{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><span class="badge">V0.5</span><h1>BIỂN & NỖI NHỚ AUTO MEDIA</h1><p>Tạo bản tin → giọng đọc → phụ đề → render → xem trước.</p></section><div class="layout"><section class="card"><h2>Tạo bản tin</h2><label>Tiêu đề</label><input id="title" placeholder="Nhập headline..."><label>Nội dung</label><textarea id="body" placeholder="Nội dung bản tin tối thiểu 20 ký tự..."></textarea><label>Nguồn</label><input id="sourceName" placeholder="Ví dụ: Reuters"><label>URL nguồn</label><input id="sourceUrl" placeholder="https://..."><label>Loại tin</label><select id="format"><option value="latest">TIN MỚI</option><option value="breaking">TIN NÓNG</option><option value="standard">THƯỜNG</option></select><button onclick="createDraft()">LƯU BẢN TIN</button></section><section class="card"><h2>Render Queue</h2><div id="jobs">Chưa có tác vụ.</div><h3>Preview</h3><video id="preview" controls></video></section></div><section class="card" style="margin-top:18px"><h2>Bản tin</h2><div id="drafts"></div></section></main><script>const api='';async function json(url,opt){const r=await fetch(url,opt);return r.json()}async function createDraft(){const d={title:title.value,body:body.value,sourceName:sourceName.value||undefined,sourceUrl:sourceUrl.value||undefined,format:format.value};const x=await json('/api/drafts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});if(x.error)return alert('Kiểm tra lại tiêu đề, nội dung và URL nguồn.');title.value='';body.value='';load()}async function render(id){await json('/api/drafts/'+id+'/render',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({voice:'male'})});load()}async function load(){const ds=await json('/api/drafts');drafts.innerHTML=ds.map(d=>`<div class="draft"><b>${d.title}</b> <span class="status">${d.status}</span><div>${d.sourceName||''}</div><button onclick="render('${d.id}')">🎬 TẠO VIDEO</button></div>`).join('')||'Chưa có bản tin.';const js=await json('/api/render-jobs');jobs.innerHTML=js.map(j=>`<div class="draft"><b>${j.status}</b> <small>${j.id.slice(0,8)}</small>${j.output?`<div><button onclick="preview.src='/'+ '${j.output}'">▶ XEM VIDEO</button></div>`:''}${j.error?`<div>${j.error}</div>`:''}</div>`).join('')||'Chưa có tác vụ.'}load();setInterval(load,3000)</script></body></html>

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biển & Nỗi Nhớ Auto Media</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#07111f;color:#eef2ff}.wrap{max-width:1180px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#111827,#172554);padding:26px;border-radius:22px}.badge{background:#b91c1c;padding:6px 11px;border-radius:999px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.card{background:#111827;border:1px solid #263449;border-radius:18px;padding:20px}label{display:block;margin:12px 0 5px}input,textarea,select{width:100%;padding:11px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:white}textarea{min-height:150px}button{margin-top:14px;background:#dc2626;color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.draft{border-top:1px solid #263449;padding:13px 0}.status{font-size:12px;padding:4px 8px;background:#1e293b;border-radius:999px}.ready{background:#166534}.progress{height:7px;background:#1e293b;border-radius:99px;margin:8px 0;overflow:hidden}.progress i{display:block;height:100%;background:#22c55e}video{width:100%;max-height:560px;background:black;border-radius:14px}.muted{color:#94a3b8;font-size:13px}@media(max-width:800px){.layout{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><span class="badge">V0.8</span><h1>BIỂN & NỖI NHỚ AUTO MEDIA</h1><p>Dashboard Vercel → Render Server → TTS → FFmpeg → MP4.</p></section><div class="layout"><section class="card"><h2>Tạo bản tin</h2><label>Tiêu đề</label><input id="title" placeholder="Nhập headline..."><label>Nội dung</label><textarea id="body" placeholder="Nội dung bản tin tối thiểu 20 ký tự..."></textarea><label>Nguồn</label><input id="sourceName" placeholder="Ví dụ: Reuters"><label>URL nguồn</label><input id="sourceUrl" placeholder="https://..."><label>Loại tin</label><select id="format"><option value="latest">TIN MỚI</option><option value="breaking">TIN NÓNG</option><option value="standard">THƯỜNG</option></select><label>Giọng đọc</label><select id="voice"><option value="male">Nam Minh</option><option value="female">Hoài My</option></select><button id="saveBtn">LƯU BẢN TIN</button></section><section class="card"><h2>Render Queue</h2><div id="jobs">Chưa có tác vụ.</div><h3>Preview</h3><video id="preview" controls></video><div class="muted">Video được truyền qua Vercel từ render server.</div></section></div><section class="card" style="margin-top:18px"><h2>Bản tin</h2><div id="drafts"></div></section></main><script>const $=id=>document.getElementById(id);function el(tag,txt,cls){const x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;if(cls)x.className=cls;return x}async function api(url,opt){const r=await fetch(url,opt);let data;try{data=await r.json()}catch{data={error:'Phản hồi không hợp lệ'}}if(!r.ok)throw new Error(data.error?.message||data.error||('HTTP '+r.status));return data}async function createDraft(){try{const d={title:$('title').value,body:$('body').value,sourceName:$('sourceName').value||undefined,sourceUrl:$('sourceUrl').value||undefined,format:$('format').value};await api('/api/drafts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});$('title').value='';$('body').value='';await load()}catch(e){alert(e.message)}}async function render(id){try{await api('/api/drafts/'+id+'/render',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({voice:$('voice').value})});await load()}catch(e){alert(e.message)}}function mediaUrl(output){const name=String(output||'').replace(/^output\//,'');return '/render-output/'+encodeURIComponent(name)}async function load(){try{const ds=await api('/api/drafts');const box=$('drafts');box.replaceChildren();if(!ds.length)box.textContent='Chưa có bản tin.';for(const d of ds){const wrap=el('div',undefined,'draft');const title=el('b',d.title);const st=el('span',' '+d.status,'status');wrap.append(title,st,el('div',d.sourceName||''));const btn=el('button','🎬 TẠO VIDEO');btn.onclick=()=>render(d.id);wrap.append(btn);box.append(wrap)}const js=await api('/api/render-jobs');const jobs=$('jobs');jobs.replaceChildren();if(!js.length)jobs.textContent='Chưa có tác vụ.';for(const j of js){const wrap=el('div',undefined,'draft');wrap.append(el('b',j.status+' '),el('small',j.id.slice(0,8)));const p=el('div',undefined,'progress');const i=document.createElement('i');i.style.width=(j.progress||0)+'%';p.append(i);wrap.append(p);if(j.output){const b=el('button','▶ XEM VIDEO');b.onclick=()=>{$('preview').src=mediaUrl(j.output);$('preview').play().catch(()=>{})};wrap.append(b)}if(j.error)wrap.append(el('div',j.error));jobs.append(wrap)}}catch(e){$('jobs').textContent='Không kết nối được Render API: '+e.message}}$('saveBtn').onclick=createDraft;load();setInterval(load,3000)</script></body></html>
